<!DOCTYPE html>
<html lang="en">
    <head>
            <link rel="icon" href="/favicon.ico">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flowcase - Change password</title>

        <link rel="stylesheet" type="text/css" href="/static/css/base.css">
        <link rel="stylesheet" type="text/css" href="/static/css/login.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    </head>
    
    <body>
        <div class="form-container">
            <div class="inner-content">
                <h2>Change password</h2>
                <p style="color: var(--text-color-light); margin: 0 0 1.5rem 0;">{% if forced %}You must choose a new password before you can continue.{% else %}Choose a new password for your account.{% endif %}</p>
                <form class="form" action="/account/password" method="POST">
                    <div class="input-group">
                        <label for="current_password">Current password</label>
                        <input type="password" name="current_password" id="current_password" required autofocus>
                    </div>
                    <div class="input-group">
                        <label for="new_password">New password</label>
                        <input type="password" name="new_password" id="new_password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm_password">Confirm new password</label>
                        <input type="password" name="confirm_password" id="confirm_password" required>
                    </div>
                    <button class="button-1-full">Change password</button>
                    {% if error %}
                        <div class="error-message">
                            {{ error }}
                        </div>
                    {% endif %}
                </form>
                <p style="margin-top: 1.5rem;">{% if forced %}<form method="POST" action="/logout" style="display:inline;"><button type="submit" style="background:none;border:none;padding:0;cursor:pointer;font:inherit;color: var(--text-color-light);">Log out</button></form>{% else %}<a href="/dashboard" style="color: var(--text-color-light);">Cancel</a>{% endif %}</p>
            </div>
        </div>
    </body>
</html>
