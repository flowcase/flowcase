location /desktop/{instance_id}/vnc/ {
	auth_request /droplet_connect/{instance_id};
	auth_request_set $cookie_token $upstream_http_set_cookie;

	resolver 127.0.0.11 valid=10s ipv6=off;
	set $upstream {container_name};
	rewrite ^/desktop/{instance_id}/vnc/(.*)$ /$1 break;
	proxy_pass https://$upstream:6901;

	proxy_set_header Authorization "Basic {authHeader}";
}

location /desktop/{instance_id}/vnc/websockify {
	auth_request /droplet_connect/{instance_id};
	auth_request_set $cookie_token $upstream_http_set_cookie;

	resolver 127.0.0.11 valid=10s ipv6=off;
	set $upstream {container_name};
	rewrite ^/desktop/{instance_id}/vnc/websockify(.*)$ /websockify/$1 break;
	proxy_pass https://$upstream:6901;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection 'upgrade';
	proxy_set_header Host $host;
	proxy_cache_bypass $http_upgrade;

	proxy_read_timeout 86400s;
	proxy_buffering off;

	proxy_set_header Authorization "Basic {authHeader}";
}

